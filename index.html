<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem Keuangan - MTs Al-Fatah</title>

  <!-- Tab Icon Browser -->
  <link rel="icon" href="mts.ico" type="image/x-icon">
  <link rel="shortcut icon" href="mts.ico" type="image/x-icon">

  <!-- Tag PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="apple-touch-icon" href="logo-192.png">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    
    <div class="brand-header">
      <img src="logo.png" alt="Logo Sekolah" class="logo-img" id="schoolLogo">
      <h2>SisKeu MTs Al-Fatah</h2>
      <p class="subtitle">Silakan pilih akses masuk Anda</p>
    </div>

    <div class="role-grid">
      <div class="role-card active" onclick="selectRole('Admin', this)">
        <div class="role-icon">🛡️ </div>
        <div class="role-title">Admin</div>
      </div>
      <div class="role-card" onclick="selectRole('Walikelas', this)">
        <div class="role-icon">👨‍🏫</div>
        <div class="role-title">Wali Kelas</div>
      </div>
      <div class="role-card" onclick="selectRole('Siswa', this)">
        <div class="role-icon">🎓</div>
        <div class="role-title">Siswa</div>
      </div>
    </div>

    <form id="loginForm">
      <input type="hidden" id="selectedRole" value="Admin">

      <div class="form-group">
        <label id="labelUsername" for="username">Username / ID Admin</label>
        <input type="text" id="username" placeholder="Masukkan ID Admin" required autocomplete="off">
      </div>

      <div class="form-group" id="groupPassword">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Masukkan password" required>
          <span class="toggle-password" onclick="togglePasswordVisibility('password', this)" style="cursor: pointer; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group remember-me-group" style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
        <input type="checkbox" id="rememberMe" style="width: auto; margin: 0; cursor: pointer;">
        <label for="rememberMe" style="margin: 0; font-size: 14px; font-weight: normal; cursor: pointer;">Ingat Saya</label>
      </div>

      <button type="submit" id="btnSubmit" class="btn-login">Masuk</button>
    </form>

    <div id="message"></div>
  </div>
</div>

<!-- Custom PWA Install Banner -->
<div id="pwaInstallBanner" class="pwa-banner" style="display: none;">
  <img src="logo-192.png" alt="Logo App" class="pwa-banner-icon">
  <div class="pwa-banner-text">
    <strong>Aplikasi SisKeu</strong>
    <span>Install aplikasi untuk akses lebih cepat</span>
  </div>
  <button id="btnPwaInstall" class="pwa-btn-install">Install</button>
  <button id="btnPwaClose" class="pwa-btn-close">&times;</button>
</div>

<!-- External Script -->
<script src="script.js"></script>

</body>
</html>
